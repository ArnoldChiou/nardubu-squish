name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Validate frost geometry
        run: node scripts/check-geometry.mjs

      - name: Validate irreversible soft-body physics
        run: node scripts/check-physics.mjs

      - name: Validate crisp audio and staged fracture
        run: node scripts/check-crunch.mjs

      - name: Normalize project asset paths
        run: mv dist/client/nardubu-squish/_next dist/client/_next

      - name: Verify deployable entrypoint
        run: |
          test -s dist/client/index.html
          test -d dist/client/_next/static/chunks
          grep -q 'BLUEBERRY / CRUSH' dist/client/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
